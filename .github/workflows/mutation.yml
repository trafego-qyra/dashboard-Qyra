name: Teste de mutação

# O Stryker é caro demais para rodar em todo PR: roda semanal e sob demanda.
# Ele mede a qualidade dos testes da lógica de negócio, não a cobertura.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
        env:
          QYRA_FORCE_MOCK: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: reports/mutation/
          retention-days: 14
